name: Podcast 2
type: plugin
slug: podcast2
version: 4.0.1
description: Maintained Grav 2-compatible fork providing Podcast page types and RSS feeds
icon: microphone
author:
  name: Steven Jay Cohen
  email: steven.jay.cohen@gmail.com
homepage: https://github.com/stevenjaycohen/grav-plugin-podcast2
keywords: grav, plugin, podcast, music
bugs: https://github.com/stevenjaycohen/grav-plugin-podcast2/issues
docs: https://github.com/stevenjaycohen/grav-plugin-podcast2/blob/develop/README.md
license: MIT

compatibility:
  grav: ['2.0']

dependencies:
  - { name: grav, version: '>=2.0.0' }
  - breadcrumbs
  - feed
  - get-id3

form:
  validation: strict
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
